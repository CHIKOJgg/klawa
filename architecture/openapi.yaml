openapi: 3.0.3
info:
  title: Klawa API
  description: API для личного ИИ-помощника Klawa по управлению задачами.
  version: 1.0.0
servers:
  - url: /api/v1
    description: Основной сервер
tags:
  - name: Auth
    description: Авторизация и аутентификация
  - name: Users
    description: Управление пользователями
  - name: Tasks
    description: Управление задачами
  - name: Projects
    description: Управление проектами
  - name: Conversations
    description: Взаимодействие с ИИ
  - name: Reminders
    description: Напоминания
  - name: Notifications
    description: Уведомления
  - name: Memory
    description: Память ИИ
  - name: Telegram
    description: Интеграция с Telegram
  - name: Analytics
    description: Аналитика и статистика
  - name: System
    description: Системные метрики и здоровье
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    # -----------------------------
    # Common Enums
    # -----------------------------
    TaskStatus:
      type: string
      enum: [OPEN, IN_PROGRESS, COMPLETED, ARCHIVED]
      description: Статус задачи
    TaskPriority:
      type: string
      enum: [LOW, MEDIUM, HIGH, URGENT]
      description: Приоритет задачи
    NotificationType:
      type: string
      enum: [TASK_REMINDER, AI_MESSAGE, SYSTEM_ALERT]
      description: Тип уведомления
    PlatformType:
      type: string
      enum: [APP, TELEGRAM, EMAIL]
      description: Платформа уведомления
    UserRole:
      type: string
      enum: [ROLE_USER, ROLE_ADMIN]
      description: Роль пользователя
    ReminderStatus:
      type: string
      enum: [PENDING, TRIGGERED, SNOOZED, CANCELLED]
      description: Статус напоминания

    # -----------------------------
    # Generic Wrappers
    # -----------------------------
    ApiError:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          example: '2026-09-11T20:09:02+03:00'
        status:
          type: integer
          example: 400
        code:
          type: string
          example: 'VALIDATION_ERROR'
        message:
          type: string
          example: 'Неверный формат данных'
        path:
          type: string
          example: '/api/v1/tasks'
        traceId:
          type: string
          example: 'a1b2c3d4'
          
    # -----------------------------
    # DTOs: Auth & Users
    # -----------------------------
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          
    RegisterRequest:
      type: object
      required: [email, password, firstName]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        firstName:
          type: string
        lastName:
          type: string
          
    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
          
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          
    UserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        roles:
          $ref: '#/components/schemas/UserRole'
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          
    UserUpdateRequest:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        isActive:
          type: boolean
          
    UserPagedResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/UserResponse'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer

    # -----------------------------
    # DTOs: Projects
    # -----------------------------
    ProjectRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
          
    ProjectResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        userId:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          
    ProjectPagedResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ProjectResponse'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer

    # -----------------------------
    # DTOs: Tasks
    # -----------------------------
    TaskRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
        description:
          type: string
        projectId:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          $ref: '#/components/schemas/TaskPriority'
        dueDate:
          type: string
          format: date-time
          
    TaskStatusUpdateRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/TaskStatus'

    TaskResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        projectId:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          $ref: '#/components/schemas/TaskPriority'
        dueDate:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TaskPagedResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/TaskResponse'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          
    # -----------------------------
    # DTOs: AI / Conversations
    # -----------------------------
    ChatMessageRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
        conversationId:
          type: string
          format: uuid
          
    ChatMessageResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        conversationId:
          type: string
          format: uuid
        role:
          type: string
          example: 'assistant'
        content:
          type: string
        tokenCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    ConversationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: integer
          format: int64
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          
    ConversationPagedResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ConversationResponse'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer

    SummaryResponse:
      type: object
      properties:
        summary:
          type: string
        createdAt:
          type: string
          format: date-time
          
    PriorityResponse:
      type: object
      properties:
        priorities:
          type: array
          items:
            type: string
            
    SuggestionResponse:
      type: object
      properties:
        suggestions:
          type: array
          items:
            type: string

    # -----------------------------
    # DTOs: Reminders
    # -----------------------------
    ReminderRequest:
      type: object
      required: [triggerTime, message]
      properties:
        taskId:
          type: integer
          format: int64
        triggerTime:
          type: string
          format: date-time
        message:
          type: string
          
    ReminderResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        taskId:
          type: integer
          format: int64
        triggerTime:
          type: string
          format: date-time
        message:
          type: string
        status:
          $ref: '#/components/schemas/ReminderStatus'
        lastNotifiedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ReminderPagedResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ReminderResponse'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer

    # -----------------------------
    # DTOs: Notifications
    # -----------------------------
    NotificationResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        type:
          $ref: '#/components/schemas/NotificationType'
        message:
          type: string
        platform:
          $ref: '#/components/schemas/PlatformType'
        isRead:
          type: boolean
        readAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
          
    NotificationPagedResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/NotificationResponse'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer

    # -----------------------------
    # DTOs: Memory
    # -----------------------------
    MemoryRequest:
      type: object
      required: [key, value]
      properties:
        key:
          type: string
        value:
          type: string
        source:
          type: string
          example: 'MANUAL'
          
    MemoryResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        key:
          type: string
        value:
          type: string
        source:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    MemoryPagedResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/MemoryResponse'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer

    # -----------------------------
    # DTOs: Telegram
    # -----------------------------
    TelegramLinkRequest:
      type: object
      required: [telegramChatId]
      properties:
        telegramChatId:
          type: integer
          format: int64
        telegramUsername:
          type: string
          
    TelegramSendRequest:
      type: object
      required: [message, telegramChatId]
      properties:
        message:
          type: string
        telegramChatId:
          type: integer
          format: int64

    # -----------------------------
    # DTOs: Analytics
    # -----------------------------
    AnalyticsProductivityResponse:
      type: object
      properties:
        completedTasksTotal:
          type: integer
        productivityScore:
          type: number
          format: double

    AnalyticsTasksResponse:
      type: object
      properties:
        total:
          type: integer
        completed:
          type: integer
        inProgress:
          type: integer
        overdue:
          type: integer

    AnalyticsHabitsResponse:
      type: object
      properties:
        streaks:
          type: object
          additionalProperties:
            type: integer
            
    AnalyticsWorkloadResponse:
      type: object
      properties:
        workloadLevel:
          type: string
          example: 'HIGH'

    # -----------------------------
    # DTOs: System
    # -----------------------------
    SystemHealthResponse:
      type: object
      properties:
        status:
          type: string
          example: 'UP'
        database:
          type: string
          example: 'UP'
          
    SystemMetricsResponse:
      type: object
      properties:
        uptime:
          type: integer
          format: int64
        memoryUsed:
          type: integer
          format: int64

    SystemVersionResponse:
      type: object
      properties:
        version:
          type: string
          example: '1.0.0'
        commit:
          type: string
          example: 'abc123d'

paths:
  # ==========================================
  # AUTHENTICATION
  # ==========================================
  /auth/authenticate:
    post:
      tags: [Auth]
      summary: Аутентификация пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Успешная аутентификация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Неверные данные
        '401':
          description: Неверный логин или пароль
          
  /auth/register:
    post:
      tags: [Auth]
      summary: Регистрация нового пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Пользователь успешно зарегистрирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Ошибка валидации
        '409':
          description: Email уже занят
          
  /auth/me:
    get:
      tags: [Auth]
      summary: Получение профиля текущего пользователя
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Профиль пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Не авторизован
          
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Обновление токена доступа
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Токен успешно обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Токен недействителен
          
  /auth/logout:
    post:
      tags: [Auth]
      summary: Выход пользователя (отзыв токена)
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Успешный выход
        '401':
          description: Не авторизован

  # ==========================================
  # USERS
  # ==========================================
  /users:
    get:
      tags: [Users]
      summary: Получение списка пользователей
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Список пользователей
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPagedResponse'
        '401':
          description: Не авторизован
        '403':
          description: Нет прав доступа

  /users/{id}:
    get:
      tags: [Users]
      summary: Получение пользователя по ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Данные пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Не авторизован
        '404':
          description: Пользователь не найден
          
    put:
      tags: [Users]
      summary: Обновление данных пользователя
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: Пользователь обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Не авторизован
        '404':
          description: Пользователь не найден
          
    delete:
      tags: [Users]
      summary: Удаление пользователя
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Пользователь удален
        '401':
          description: Не авторизован
        '404':
          description: Пользователь не найден

  # ==========================================
  # TASKS
  # ==========================================
  /tasks:
    get:
      tags: [Tasks]
      summary: Получение списка задач
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Список задач
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPagedResponse'
        '401':
          description: Не авторизован

    post:
      tags: [Tasks]
      summary: Создание новой задачи
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskRequest'
      responses:
        '201':
          description: Задача создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          description: Ошибка валидации
        '401':
          description: Не авторизован

  /tasks/{id}:
    get:
      tags: [Tasks]
      summary: Получение задачи по ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Детали задачи
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '401':
          description: Не авторизован
        '404':
          description: Задача не найдена

    put:
      tags: [Tasks]
      summary: Обновление задачи
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskRequest'
      responses:
        '200':
          description: Задача обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '401':
          description: Не авторизован
        '404':
          description: Задача не найдена

    delete:
      tags: [Tasks]
      summary: Удаление задачи
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Задача удалена
        '401':
          description: Не авторизован
        '404':
          description: Задача не найдена

  /tasks/{id}/complete:
    post:
      tags: [Tasks]
      summary: Завершение задачи
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Статус изменен на COMPLETED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '401':
          description: Не авторизован
        '404':
          description: Задача не найдена

  /tasks/{id}/reopen:
    post:
      tags: [Tasks]
      summary: Повторное открытие задачи
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Статус изменен на OPEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '401':
          description: Не авторизован
        '404':
          description: Задача не найдена

  /tasks/{id}/archive:
    post:
      tags: [Tasks]
      summary: Архивирование задачи
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Статус изменен на ARCHIVED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '401':
          description: Не авторизован
        '404':
          description: Задача не найдена
          
  /tasks/{id}/status:
    patch:
      tags: [Tasks]
      summary: Обновление статуса задачи (state machine)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskStatusUpdateRequest'
      responses:
        '200':
          description: Статус успешно изменен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          description: Ошибка валидации
        '401':
          description: Не авторизован
        '404':
          description: Задача не найдена

  # ==========================================
  # PROJECTS
  # ==========================================
  /projects:
    get:
      tags: [Projects]
      summary: Получение списка проектов
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Список проектов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPagedResponse'
        '401':
          description: Не авторизован

    post:
      tags: [Projects]
      summary: Создание нового проекта
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectRequest'
      responses:
        '201':
          description: Проект создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400':
          description: Ошибка валидации
        '401':
          description: Не авторизован

  /projects/{id}:
    get:
      tags: [Projects]
